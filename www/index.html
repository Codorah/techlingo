<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>TechLingo — Speak Tech. Think Global.</title>
  <meta name="description" content="Apprends l'anglais technique : DevOps, web, mobile, réseaux, systèmes. Prépare tes entretiens de développeur.">
  <meta name="theme-color" content="#F5F8FB">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="TechLingo">
  <meta name="format-detection" content="telephone=no">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="preload" href="fonts/DMSans-700-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="fonts.css">
  <link rel="stylesheet" href="style.css">
  <script>
    // Applique le thème avant le premier affichage (évite le flash blanc)
    try {
      var d = (JSON.parse(localStorage.getItem('techlingo.v1')) || {}).settings;
      d = d && d.dark != null ? d.dark : matchMedia('(prefers-color-scheme: dark)').matches;
      document.documentElement.dataset.theme = d ? 'dark' : 'light';
    } catch (e) {}
  </script>
</head>
<body>
  <div id="shell">
    <main id="app" aria-live="polite"></main>
    <nav id="tabbar" aria-label="Navigation principale" hidden></nav>
    <div id="toast" role="status"></div>
    <canvas id="confetti" aria-hidden="true"></canvas>

    <!-- Écran de chargement animé -->
    <div id="boot" aria-hidden="true">
      <div class="boot-logo">
        <svg viewBox="0 0 1024 1024" width="150" height="150">
          <defs>
            <linearGradient id="bg1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#38BDF8"/><stop offset="1" stop-color="#0369A1"/></linearGradient>
            <radialGradient id="gl1" cx=".28" cy=".2" r=".7"><stop offset="0" stop-color="#fff" stop-opacity=".28"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
          </defs>
          <rect class="b-tile" width="1024" height="1024" rx="230" fill="url(#bg1)"/>
          <rect width="1024" height="1024" rx="230" fill="url(#gl1)"/>
          <g class="b-mark" transform="translate(512 520) scale(.92) translate(-512 -512)">
            <line x1="512" y1="292" x2="512" y2="222" stroke="#fff" stroke-width="26" stroke-linecap="round"/>
            <circle class="b-ball" cx="512" cy="192" r="38" fill="#FBBF24"/>
            <rect x="186" y="438" width="48" height="134" rx="24" fill="#E0F2FE"/>
            <rect x="790" y="438" width="48" height="134" rx="24" fill="#E0F2FE"/>
            <path d="M232 460a170 170 0 0 1 170-170h220a170 170 0 0 1 170 170v90a170 170 0 0 1-170 170H470L318 836l22-116h-6a170 170 0 0 1-102-170z" fill="#fff"/>
            <rect x="292" y="380" width="440" height="250" rx="112" fill="#0F2A44"/>
            <circle class="b-eye" cx="404" cy="494" r="35" fill="#38E1FF"/>
            <circle class="b-eye" cx="620" cy="494" r="35" fill="#38E1FF"/>
            <path d="M444 562Q512 618 580 562" stroke="#38E1FF" stroke-width="26" fill="none" stroke-linecap="round"/>
          </g>
        </svg>
      </div>
      <div class="boot-name">TechLingo</div>
      <div class="boot-tag">Speak Tech. Think Global.</div>
      <div class="boot-bar"><i></i></div>
    </div>
  </div>
  <noscript>TechLingo a besoin de JavaScript pour fonctionner.</noscript>
  <script src="data.js"></script>
  <script src="data-extra.js"></script>
  <script src="icons.js"></script>
  <script src="app.js"></script>
</body>
</html>
